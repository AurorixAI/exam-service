name: Deploy

# develop -> stage.algolab.me   (algo-preview stack, built from ~/algo/preview-src)
# main    -> algolab.me         (algo-staging stack — despite the name, production)
#
# Deploy only runs if the test job passes.

on:
  push:
    branches: [main, develop, CEO]

# CEO is the working branch: run verification, never deploy it implicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVER_HOST: 91.99.183.252
  SERVER_USER: algo
  REPO_DIR: exam-service
  COMPOSE_SERVICE: exam-service
  PROD_CONTAINER: algo-staging-exam
  PREVIEW_CONTAINER: algo-preview-exam

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment guards without deploying
        run: python3 .github/scripts/test_deploy_workflow_guards.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile check
        run: python -m py_compile $(find src -name "*.py")

      - name: Run tests
        run: pytest tests/ -q --tb=short

  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Set up deploy key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Resolve target environment
        id: t
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            {
              echo "project=algo-preview"
              echo "compose=algo-infrastructure/compose/docker-compose.preview.yml"
              echo "envfile=.env.preview"
              echo "srcdir=preview-src/$REPO_DIR"
              echo "container=$PREVIEW_CONTAINER"
              echo "site=https://stage.algolab.me"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "project=algo-staging"
              echo "compose=algo-infrastructure/compose/docker-compose.staging.yml"
              echo "envfile=.env.staging"
              echo "srcdir=$REPO_DIR"
              echo "container=$PROD_CONTAINER"
              echo "site=https://algolab.me"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build the exact tested Git revision on server
        run: |
          RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" bash -s -- \
            "${{ steps.t.outputs.srcdir }}" "${{ steps.t.outputs.compose }}" \
            "${{ steps.t.outputs.project }}" "${{ steps.t.outputs.envfile }}" \
            "${{ steps.t.outputs.container }}" "${{ github.sha }}" \
            "${{ github.ref_name }}" "${{ github.run_id }}-${{ github.run_attempt }}" \
            "$RELEASED_AT" "$COMPOSE_SERVICE" <<'REMOTE'
          set -euo pipefail
          srcdir=$1; compose=$2; project=$3; envfile=$4; container=$5
          sha=$6; ref=$7; run_id=$8; released_at=$9; service=${10}
          root="$HOME/algo"
          cd "$root/$srcdir"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Refusing deployment from a modified server checkout" >&2
            exit 1
          fi
          git fetch --quiet origin "$ref"
          git cat-file -e "$sha^{commit}"
          git merge-base --is-ancestor "$sha" FETCH_HEAD
          git checkout --detach --quiet "$sha"
          test "$(git rev-parse HEAD)" = "$sha"
          release_dir="$root/releases/git-$service-$sha-$run_id"
          # A new context contains only committed files. Ignored env/cache files
          # from the server checkout never enter COPY . . or the build context.
          test ! -e "$release_dir"
          mkdir -p "$release_dir/source"
          git archive --format=tar "$sha" > "$release_dir/source.tar"
          archive_sha=$(sha256sum "$release_dir/source.tar" | cut -d ' ' -f 1)
          tar -xf "$release_dir/source.tar" -C "$release_dir/source"
          previous_image=$(docker inspect --format '{{.Image}}' "$container")
          rollback_tag="algolab-rollback-$project-$service:${sha:0:12}-$run_id"
          docker image tag "$previous_image" "$rollback_tag"
          python3 - "$release_dir" "$service" "$sha" "$ref" "$archive_sha" \
            "$previous_image" "$rollback_tag" "$released_at" <<'PY_RELEASE'
          import json, pathlib, sys
          release, service, sha, ref, archive, previous, rollback, at = sys.argv[1:]
          path = pathlib.Path(release)
          build = {"context": str(path / "source"), "labels": {
              "org.opencontainers.image.revision": sha,
              "io.algolab.source.archive.sha256": archive,
          }}
          (path / "source.compose.json").write_text(json.dumps({"services": {service: {"build": build}}}))
          (path / "release-record.json").write_text(json.dumps({
              "service": service, "source_sha": sha, "source_ref": ref,
              "source_archive_sha256": archive, "previous_image_id": previous,
              "rollback_tag": rollback, "released_at": at,
          }, indent=2) + "\n")
          PY_RELEASE
          cd "$root"
          export RELEASE_SHA="$sha" RELEASE_REF="$ref" RELEASED_AT="$released_at"
          docker compose -f "$compose" -f "$release_dir/source.compose.json" \
            -p "$project" --env-file "$envfile" build "$service"
          docker compose -f "$compose" -f "$release_dir/source.compose.json" \
            -p "$project" --env-file "$envfile" \
            up -d --no-build --no-deps "$service"
          # Only this application changes; DB/Redis/dependencies stay running.
          docker exec algo-staging-nginx nginx -t
          docker exec algo-staging-nginx nginx -s reload
          # Keep the tagged previous image for rollback; dangling images are
          # pruned only after the release is verified (see Verify deployed revision).
          REMOTE

      - name: Verify container is healthy
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "
            C=${{ steps.t.outputs.container }}
            for i in \$(seq 1 24); do
              # A container with no healthcheck makes '{{.State.Health.Status}}'
              # print an empty line AND exit 1, so the '|| echo' fallback yields
              # a leading newline and never matches. Guard on .State.Health.
              STATUS=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \$C 2>/dev/null || echo missing)
              RUNNING=\$(docker inspect --format='{{.State.Running}}' \$C 2>/dev/null || echo false)
              if [ \"\$RUNNING\" != true ]; then
                echo \"\$C is not running\" >&2
                exit 1
              fi
              case \$STATUS in
                healthy) echo \"\$C is healthy\"; exit 0 ;;
                none)    [ \"\$RUNNING\" = true ] && { echo \"\$C is running (no healthcheck defined)\"; exit 0; } ;;
              esac
              sleep 5
            done
            echo \"\$C did not become healthy in time\" >&2
            docker logs \$C --tail 80
            exit 1
          "

      - name: Verify deployed revision
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "
            set -euo pipefail
            C=${{ steps.t.outputs.container }}
            DEPLOYED_SHA=\$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \$C | sed -n 's/^RELEASE_SHA=//p')
            if [ \"\$DEPLOYED_SHA\" != \"${{ github.sha }}\" ]; then
              echo \"Expected ${{ github.sha }}, container reports \$DEPLOYED_SHA\" >&2
              exit 1
            fi
            IMAGE_ID=\$(docker inspect --format '{{.Image}}' \"\$C\")
            IMAGE_REVISION=\$(docker image inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' \"\$IMAGE_ID\")
            if [ \"\$IMAGE_REVISION\" != \"${{ github.sha }}\" ]; then
              echo \"Expected image revision ${{ github.sha }}, running image reports \$IMAGE_REVISION\" >&2
              exit 1
            fi
            echo \"\$C runs verified image \$IMAGE_ID at release \$DEPLOYED_SHA\"
            # Release verified: drop dangling images only. Tagged rollback images
            # are still referenced by a tag, so `image prune -f` never removes them.
            docker image prune -f >/dev/null 2>&1 || true
          "

      - name: Export deployed release manifest
        run: |
          METADATA="$(ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' ${{ steps.t.outputs.container }} | sed -n -e '/^RELEASE_SHA=/p' -e '/^RELEASE_REF=/p' -e '/^RELEASED_AT=/p'")"
          IMAGE_ID="$(ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "docker inspect --format '{{.Image}}' ${{ steps.t.outputs.container }}")"
          DEPLOYED_SHA="$(printf '%s\n' "$METADATA" | sed -n 's/^RELEASE_SHA=//p')"
          DEPLOYED_REF="$(printf '%s\n' "$METADATA" | sed -n 's/^RELEASE_REF=//p')"
          DEPLOYED_AT="$(printf '%s\n' "$METADATA" | sed -n 's/^RELEASED_AT=//p')"
          test "$DEPLOYED_SHA" = "${{ github.sha }}"
          printf '%s\n' \
            "service=${{ env.COMPOSE_SERVICE }}" \
            "source_sha=${{ github.sha }}" \
            "source_ref=${{ github.ref_name }}" \
            "container=${{ steps.t.outputs.container }}" \
            "image_id=$IMAGE_ID" \
            "release_sha=$DEPLOYED_SHA" \
            "release_ref=$DEPLOYED_REF" \
            "released_at=$DEPLOYED_AT" > release-manifest.txt
          sed 's/^/- /' release-manifest.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Include source archive and rollback identity
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" \
            "cat ~/algo/releases/git-$COMPOSE_SERVICE-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/release-record.json" \
            > release-record.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: |
            release-manifest.txt
            release-record.json
          if-no-files-found: error

      - name: Verify site responds
        # The old check waited for 200 on "/" but "/" redirects (307) to the login.
        # Now: the service itself reports the release we just deployed (asked over
        # the same ssh, from inside its container, with the python already in the
        # image), and the public login page must be up. Every network call has a
        # limit (LESSONS rule 57).
        env:
          SITE: ${{ steps.t.outputs.site }}
          CONTAINER: ${{ steps.t.outputs.container }}
          EXPECTED_SHA: ${{ github.sha }}
          SERVICE_PORT: "8003"
        run: |
          set -u
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o BatchMode=yes)
          remote="timeout 20 docker exec $CONTAINER python -c 'import json,urllib.request as u; print(json.load(u.urlopen(\"http://127.0.0.1:$SERVICE_PORT/version\", timeout=5)).get(\"release_sha\", \"\"))'"
          got=""
          rc=1
          for attempt in $(seq 1 12); do
            got=$(ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" "$remote") && rc=0 || rc=$?
            if [ "$rc" = 0 ] && [ "$got" = "$EXPECTED_SHA" ]; then
              break
            fi
            sleep 5
          done
          if [ "$rc" != 0 ]; then
            echo "$CONTAINER на $SITE не ответил на /version (ssh или docker exec вернул код $rc)" >&2
            exit 1
          fi
          if [ "$got" != "$EXPECTED_SHA" ]; then
            echo "на $SITE ($CONTAINER) версия ${got:-<не указана>}, ожидали $EXPECTED_SHA" >&2
            exit 1
          fi
          echo "$CONTAINER /version -> release_sha $got"
          login=000
          for attempt in $(seq 1 12); do
            login=$(curl -s -o /dev/null --max-time 10 -w '%{http_code}' "$SITE/login" || true)
            [ "$login" = 200 ] && break
            sleep 5
          done
          if [ "$login" != 200 ]; then
            echo "сайт $SITE/login ответил $login, ожидали 200" >&2
            exit 1
          fi
          echo "$SITE/login -> 200"
