name: Deploy

# develop -> stage.algolab.me   (algo-preview stack, built from ~/algo/preview-src)
# main    -> algolab.me         (algo-staging stack — despite the name, production)
#
# Deploy only runs if the test job passes.

on:
  push:
    branches: [main, develop]

env:
  SERVER_HOST: 91.99.183.252
  SERVER_USER: algo
  REPO_DIR: exam-service
  COMPOSE_SERVICE: exam-service
  PROD_CONTAINER: algo-staging-exam
  PREVIEW_CONTAINER: algo-preview-exam

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile check
        run: python -m py_compile $(find src -name "*.py")

      - name: Run tests
        run: pytest tests/ -q --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Set up deploy key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Resolve target environment
        id: t
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            {
              echo "project=algo-preview"
              echo "compose=algo-infrastructure/compose/docker-compose.preview.yml"
              echo "envfile=.env.preview"
              echo "srcdir=preview-src/$REPO_DIR"
              echo "container=$PREVIEW_CONTAINER"
              echo "site=https://stage.algolab.me"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "project=algo-staging"
              echo "compose=algo-infrastructure/compose/docker-compose.staging.yml"
              echo "envfile=.env.staging"
              echo "srcdir=$REPO_DIR"
              echo "container=$PROD_CONTAINER"
              echo "site=https://algolab.me"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Pull + rebuild on server
        run: |
          RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "
            set -e
            cd ~/algo/${{ steps.t.outputs.srcdir }}
            git fetch --quiet origin ${{ github.ref_name }}
            git checkout --quiet ${{ github.ref_name }}
            git reset --hard --quiet origin/${{ github.ref_name }}
            cd ~/algo
            export RELEASE_SHA='${{ github.sha }}'
            export RELEASE_REF='${{ github.ref_name }}'
            export RELEASED_AT='$RELEASED_AT'
            docker compose -f ${{ steps.t.outputs.compose }} \
              -p ${{ steps.t.outputs.project }} \
              --env-file ${{ steps.t.outputs.envfile }} \
              up -d --build $COMPOSE_SERVICE
            # nginx caches upstream DNS; a recreated container gets a new IP
            docker compose -f algo-infrastructure/compose/docker-compose.staging.yml \
              -p algo-staging --env-file .env.staging restart nginx
          "

      - name: Verify container is healthy
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "
            C=${{ steps.t.outputs.container }}
            for i in \$(seq 1 24); do
              # A container with no healthcheck makes '{{.State.Health.Status}}'
              # print an empty line AND exit 1, so the '|| echo' fallback yields
              # a leading newline and never matches. Guard on .State.Health.
              STATUS=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \$C 2>/dev/null || echo missing)
              RUNNING=\$(docker inspect --format='{{.State.Running}}' \$C 2>/dev/null || echo false)
              case \$STATUS in
                healthy) echo \"\$C is healthy\"; exit 0 ;;
                none)    [ \"\$RUNNING\" = true ] && { echo \"\$C is running (no healthcheck defined)\"; exit 0; } ;;
              esac
              sleep 5
            done
            echo \"\$C did not become healthy in time\" >&2
            docker logs \$C --tail 80
            exit 1
          "

      - name: Verify deployed revision
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "
            C=${{ steps.t.outputs.container }}
            DEPLOYED_SHA=\$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \$C | sed -n 's/^RELEASE_SHA=//p')
            if [ \"\$DEPLOYED_SHA\" != \"${{ github.sha }}\" ]; then
              echo \"Expected ${{ github.sha }}, container reports \$DEPLOYED_SHA\" >&2
              exit 1
            fi
            echo \"\$C runs release \$DEPLOYED_SHA\"
          "

      - name: Export deployed release manifest
        run: |
          METADATA="$(ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' ${{ steps.t.outputs.container }}")"
          IMAGE_ID="$(ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "docker inspect --format '{{.Image}}' ${{ steps.t.outputs.container }}")"
          DEPLOYED_SHA="$(printf '%s\n' "$METADATA" | sed -n 's/^RELEASE_SHA=//p')"
          DEPLOYED_REF="$(printf '%s\n' "$METADATA" | sed -n 's/^RELEASE_REF=//p')"
          DEPLOYED_AT="$(printf '%s\n' "$METADATA" | sed -n 's/^RELEASED_AT=//p')"
          test "$DEPLOYED_SHA" = "${{ github.sha }}"
          printf '%s\n' \
            "service=${{ env.COMPOSE_SERVICE }}" \
            "source_sha=${{ github.sha }}" \
            "source_ref=${{ github.ref_name }}" \
            "container=${{ steps.t.outputs.container }}" \
            "image_id=$IMAGE_ID" \
            "release_sha=$DEPLOYED_SHA" \
            "release_ref=$DEPLOYED_REF" \
            "released_at=$DEPLOYED_AT" > release-manifest.txt
          sed 's/^/- /' release-manifest.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.txt
          if-no-files-found: error

      - name: Verify site responds
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.t.outputs.site }}/" || echo 000)
            [ "$CODE" = "200" ] && { echo "${{ steps.t.outputs.site }} -> 200"; exit 0; }
            sleep 5
          done
          echo "${{ steps.t.outputs.site }} never returned 200" >&2
          exit 1
